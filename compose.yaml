# The stack, and the flow every environment runs: client -> gateway -> service.
# Ports, TLS and host paths are environment facts and live in compose.dev.yaml / compose.prod.yaml,
# which only ever add.
x-rabbit: &rabbit
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:-guest}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}

x-jwt-consumer: &jwt-consumer
  # A URL, not a secret. Only identity holds key material.
  Jwt__Authority: http://identity:8080

x-aspnet: &aspnet
  ASPNETCORE_URLS: http://+:8080

x-healthcheck: &healthcheck
  test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 30s

x-backend: &backend
  restart: unless-stopped
  healthcheck: *healthcheck

services:
  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      FORUM_DB_PASSWORD: ${FORUM_DB_PASSWORD:-forum_password}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-finance_password}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
      HOUSEHOLD_DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD:-household_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3-management
    # No host ports — accessible only inside the Docker network.
    # To inspect the management UI on the VPS: ssh -L 15672:localhost:15672 deploy@YOUR_VPS
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    # Without this /var/lib/rabbitmq lives in the container layer, so every image update or
    # `compose down` discards durable queues and any message not yet acked. Postgres has had
    # pgdata from the start; the broker holds state exactly the same way and needs the same.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity:
    <<: *backend
    image: ${IDENTITY_IMAGE:-ghcr.io/hkarpinen/portfolio-identity:latest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - avatar_data:/data/avatars
    environment:
      <<: [*aspnet, *rabbit]
      ConnectionStrings__Identity: ${IDENTITY_CONN:-Host=postgres;Database=identity_db;Username=identity_user;Password=identity_password}
      # No default. Left unset, identity refuses to start and prints the openssl line that
      # generates one.
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Storage__LocalPath: /data/avatars

  forum:
    <<: *backend
    image: ${FORUM_IMAGE:-ghcr.io/hkarpinen/portfolio-forum:latest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    volumes:
      - forum_media:/data/forum
    environment:
      <<: [*aspnet, *rabbit, *jwt-consumer]
      ConnectionStrings__Forum: ${FORUM_CONN:-Host=postgres;Database=forum_db;Username=forum_user;Password=forum_password}
      Media__RootPath: /data/forum

  finance:
    <<: *backend
    image: ${FINANCE_IMAGE:-ghcr.io/hkarpinen/portfolio-finance:latest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      <<: [*aspnet, *rabbit, *jwt-consumer]
      ConnectionStrings__Finance: ${FINANCE_CONN:-Host=postgres;Database=finance_db;Username=finance_user;Password=finance_password}

  household:
    <<: *backend
    image: ${HOUSEHOLD_IMAGE:-ghcr.io/hkarpinen/portfolio-household:latest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      <<: [*aspnet, *rabbit, *jwt-consumer]
      ConnectionStrings__Household: ${HOUSEHOLD_CONN:-Host=postgres;Database=household_db;Username=household_user;Password=household_password}

  notifications:
    <<: *backend
    image: ${NOTIFICATIONS_IMAGE:-ghcr.io/hkarpinen/portfolio-notifications:latest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      <<: [*aspnet, *rabbit, *jwt-consumer]
      ConnectionStrings__Notifications: ${NOTIFICATIONS_CONN:-Host=postgres;Database=notifications_db;Username=notifications_user;Password=notifications_password}

  math:
    <<: *backend
    image: ${MATH_IMAGE:-ghcr.io/hkarpinen/portfolio-math:latest}
    depends_on:
      identity:
        condition: service_healthy
    environment:
      <<: [*aspnet, *jwt-consumer]

  geography:
    <<: *backend
    image: ${GEOGRAPHY_IMAGE:-ghcr.io/hkarpinen/portfolio-geography:latest}
    depends_on:
      identity:
        condition: service_healthy
    environment:
      <<: [*aspnet, *jwt-consumer]

  # The route table.
  # The route table.
  gateway:
    restart: unless-stopped
    image: ${GATEWAY_IMAGE:-ghcr.io/hkarpinen/portfolio-gateway:latest}
    environment:
      SVC_IDENTITY_URL: http://identity:8080
      SVC_FORUM_URL: http://forum:8080
      SVC_FINANCE_URL: http://finance:8080
      SVC_NOTIFICATIONS_URL: http://notifications:8080
      SVC_HOUSEHOLD_URL: http://household:8080
      SVC_MATH_URL: http://math:8080
      SVC_GEOGRAPHY_URL: http://geography:8080

  frontend:
    restart: unless-stopped
    image: ${FRONTEND_IMAGE:-ghcr.io/hkarpinen/portfolio-frontend:latest}
    environment:
      INTERNAL_API_URL: http://gateway:8080
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}

volumes:
  pgdata:
  rabbitmq_data:
  avatar_data:
  forum_media:
  certbot_webroot:
