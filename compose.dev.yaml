# Standalone dev stack — run with:
#   docker compose -f compose.dev.yaml up -d
#
# Runs infrastructure and backends only. No nginx.
# The frontend is NOT containerised in dev — run it locally:
#   cd ../frontend && npm run dev
#
# Upload files are written to ./uploads/ (bind-mounted into the containers)
# and served by the Next.js dev server via a /uploads/* rewrite.
# All API traffic uses Next.js rewrites (next.config.mjs) → direct to each backend port.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      FORUM_DB_PASSWORD: ${FORUM_DB_PASSWORD:-forum_password}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-finance_password}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
      HOUSEHOLD_DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD:-household_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  identity:
    build:
      context: ../identity
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./uploads/avatars:/data/avatars
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: ${IDENTITY_CONN:-Host=postgres;Database=identity_db;Username=identity_user;Password=identity_password}
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Email__Host: mailpit
      Email__Port: "1025"
      Email__BaseUrl: http://localhost:3000
      Storage__LocalPath: /data/avatars
      Storage__PublicBaseUrl: http://localhost:3000/uploads/avatars

  forum:
    build:
      context: ../forum
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./uploads/forum:/data/forum
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Forum: ${FORUM_CONN:-Host=postgres;Database=forum_db;Username=forum_user;Password=forum_password}
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Media__RootPath: /data/forum
      Media__PublicBaseUrl: http://localhost:3000/uploads/forum

  finance:
    build:
      context: ../finance
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Finance: ${FINANCE_CONN:-Host=postgres;Database=finance_db;Username=finance_user;Password=finance_password}
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Plaid__ClientId: ${PLAID_CLIENT_ID:-}
      Plaid__Secret: ${PLAID_SECRET:-}
      Plaid__Environment: ${PLAID_ENVIRONMENT:-sandbox}
      Plaid__WebhookUrl: ${PLAID_WEBHOOK_URL:-}

  notifications:
    build:
      context: ../notifications
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Notifications: ${NOTIFICATIONS_CONN:-Host=postgres;Database=notifications_db;Username=notifications_user;Password=notifications_password}
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}

  household:
    build:
      context: ../household
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Household: ${HOUSEHOLD_CONN:-Host=postgres;Database=household_db;Username=household_user;Password=household_password}
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}

  math:
    build:
      context: ../math
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}

  geography:
    build:
      context: ../geography
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:-changeme-at-least-32-chars-long!}
      OpenWeatherMap__ApiKey: ${OPENWEATHERMAP_API_KEY:-}

volumes:
  pgdata:
