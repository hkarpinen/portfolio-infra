# Dev overrides. This file is not standalone — it layers on compose.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# Everything the two environments share now lives in compose.yaml exactly once. What is here is
# only what genuinely differs: building from source instead of pulling images, publishing ports,
# the Development environment name, rate limits loose enough for a parallel e2e run, and the
# handful of URLs that point at localhost.
#
# The frontend is NOT containerised in dev — run it locally:
#   cd ../frontend && npm run dev
#
# next.config.mjs rewrites /api/* to the gateway on :8088; the gateway holds the only route table.
# Upload files are written to ./uploads/ and served in dev by the Next.js route handler at
# app/uploads/[...slug]/route.ts.

# A parallel e2e run drives far more traffic per minute than any real user, and the production
# posture would reject it — which surfaces as the frontend's error boundary rather than as
# anything resembling a rate-limit message.
x-dev-ratelimits: &dev-ratelimits
  RateLimiting__standard: "5000"
  RateLimiting__auth: "5000"
  RateLimiting__write: "5000"
  RateLimiting__api: "5000"
  RateLimiting__search: "5000"

x-dev-mail: &dev-mail
  Email__Host: mailpit
  Email__Port: "1025"
  Email__BaseUrl: http://localhost:3000

services:
  postgres:
    ports:
      - "5432:5432"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  # Dev only — production sends through a real SMTP relay via EMAIL_* env vars.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  identity:
    build:
      context: ../identity
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./uploads/avatars:/data/avatars
    environment:
      <<: [*dev-ratelimits, *dev-mail]
      ASPNETCORE_ENVIRONMENT: Development
      # Throwaway dev key, committed on purpose so `compose up` needs no setup. Production has no
      # default: compose refuses to start without JWT_PRIVATE_KEY_PEM.
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Storage__PublicBaseUrl: http://localhost:3000/uploads/avatars
      # Blank on purpose: an empty secret is what makes RecaptchaService skip verification. The
      # base inherits a real key from .env, and with it every demo/start and register in dev fails
      # CAPTCHA against Google with a dummy token.
      Recaptcha__SecretKey: ""

  forum:
    build:
      context: ../forum
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./uploads/forum:/data/forum
    environment:
      <<: *dev-ratelimits
      ASPNETCORE_ENVIRONMENT: Development
      Media__PublicBaseUrl: http://localhost:3000/uploads/forum

  finance:
    build:
      context: ../finance
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      <<: *dev-ratelimits
      ASPNETCORE_ENVIRONMENT: Development

  household:
    build:
      context: ../household
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      <<: *dev-ratelimits
      ASPNETCORE_ENVIRONMENT: Development

  notifications:
    build:
      context: ../notifications
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      <<: [*dev-ratelimits, *dev-mail]
      ASPNETCORE_ENVIRONMENT: Development
      Email__FromAddress: noreply@hankkarpinen.com
      Email__FromName: hankkarpinen.com
      # mailpit takes no credentials; inheriting the relay's from .env makes every dev mail fail
      # authentication.
      Email__Username: ""
      Email__Password: ""

  math:
    build:
      context: ../math
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  geography:
    build:
      context: ../geography
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-ghcr.io/hkarpinen/portfolio-gateway:dev}
    # Plain HTTP on one port. No TLS, no ACME and no canonical-host redirect — those are the parts
    # of the edge that need a real domain, and they stay in compose.yaml.
    #
    # !override because compose MERGES port lists: without it this inherits the base's 80 and 443
    # and tries to bind them on the host alongside 8088.
    ports: !override
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # !override for the same reason as ports: otherwise the base's /etc/letsencrypt and
    # certbot_webroot mounts come through, and neither exists on a dev machine.
    volumes: !override
      - ./uploads/avatars:/var/www/avatars:ro
      - ./uploads/forum:/var/www/forum:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # No TLS paths, so nothing binds 443. HttpPort doubles as the internal port, which makes
      # every request "internal" and skips the redirect — CanonicalHost is blank here anyway.
      Gateway__HttpPort: "8080"
      Gateway__InternalPort: "8080"
      Tls__CertPath: ""
      Tls__KeyPath: ""
      CanonicalHost: ""
      # The e2e suite overrides this to point at its standalone build on :3100.
      SVC_FRONTEND_URL: ${SVC_FRONTEND_URL:-http://host.docker.internal:3000}

  # Profiled off: `npm run dev` serves the frontend in dev. Start the container with
  # `--profile containerised-frontend` to exercise the production image locally.
  frontend:
    profiles: ["containerised-frontend"]
