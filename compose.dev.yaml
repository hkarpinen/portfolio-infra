# Dev facts, layered on compose.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# Only additions — the base declares nothing about ports, TLS or host paths, so nothing here has
# to undo anything. The flow is the same one production runs: client -> gateway -> service.
#
# The frontend is NOT containerised in dev — run it locally:
#   cd ../frontend && npm run dev
#
# next.config.mjs rewrites /api/* to the gateway on :8088.

# A parallel e2e run drives far more traffic per minute than any real user, and the production
# posture would reject it — which surfaces as the frontend's error boundary rather than as
# anything resembling a rate-limit message.
x-dev-ratelimits: &dev-ratelimits
  RateLimiting__standard: "5000"
  RateLimiting__auth: "5000"
  RateLimiting__write: "5000"
  RateLimiting__api: "5000"
  RateLimiting__search: "5000"

x-dev-mail: &dev-mail
  Email__Host: mailpit
  Email__Port: "1025"
  Email__BaseUrl: http://localhost:3000

x-dev: &dev
  ASPNETCORE_ENVIRONMENT: Development

services:
  postgres:
    ports:
      - "5432:5432"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  # Dev only — production sends through a real SMTP relay.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  identity:
    build:
      context: ../identity
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./uploads/avatars:/data/avatars
    environment:
      <<: [*dev, *dev-ratelimits, *dev-mail]
      # Throwaway key, committed on purpose so `compose up` needs no setup. Production has no
      # default: identity refuses to start and prints the openssl line that generates one.
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Storage__PublicBaseUrl: http://localhost:3000/uploads/avatars
      # Empty is what makes RecaptchaService skip verification. With a real key, every demo/start
      # and register in dev fails CAPTCHA against Google with a dummy token.
      Recaptcha__SecretKey: ""

  forum:
    build:
      context: ../forum
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./uploads/forum:/data/forum
    environment:
      <<: [*dev, *dev-ratelimits]
      Media__PublicBaseUrl: http://localhost:3000/uploads/forum

  finance:
    build:
      context: ../finance
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      <<: [*dev, *dev-ratelimits]

  household:
    build:
      context: ../household
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      <<: [*dev, *dev-ratelimits]

  notifications:
    build:
      context: ../notifications
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      <<: [*dev, *dev-ratelimits, *dev-mail]
      Email__FromAddress: noreply@hankkarpinen.com
      Email__FromName: hankkarpinen.com
      # mailpit takes no credentials.
      Email__Username: ""
      Email__Password: ""

  math:
    build:
      context: ../math
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
    environment:
      <<: *dev

  geography:
    build:
      context: ../geography
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    environment:
      <<: *dev
      OpenWeatherMap__ApiKey: ${OPENWEATHERMAP_API_KEY:-}

  media:
    build:
      context: ../media
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    volumes:
      - ./uploads/media:/data/media
    environment:
      <<: [*dev, *dev-ratelimits]

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-ghcr.io/hkarpinen/portfolio-gateway:dev}
    ports:
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads/avatars:/var/www/avatars:ro
      - ./uploads/forum:/var/www/forum:ro
    environment:
      <<: *dev
      # No Tls paths, so nothing binds 443. No CanonicalHost, so nothing redirects.
      Gateway__HttpPort: "8080"
      Uploads__Avatars: /var/www/avatars
      Uploads__Forum: /var/www/forum
      SVC_MEDIA_URL: http://media:8080
      # The e2e suite points this at its standalone build on :3100.
      SVC_FRONTEND_URL: ${SVC_FRONTEND_URL:-http://host.docker.internal:3000}

  # Profiled off: `npm run dev` serves the frontend in dev.
  frontend:
    profiles: ["containerised-frontend"]
