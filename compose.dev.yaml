# Standalone dev stack — run with:
#   docker compose -f compose.dev.yaml up -d
#
# Runs infrastructure and backends only. No nginx.
# The frontend is NOT containerised in dev — run it locally:
#   cd ../frontend && npm run dev
#
# Upload files are written to ./uploads/ (bind-mounted into the containers)
# and served by the Next.js dev server via a /uploads/* rewrite.
# All API traffic uses Next.js rewrites (next.config.mjs) → direct to each backend port.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      FORUM_DB_PASSWORD: ${FORUM_DB_PASSWORD:-forum_password}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-finance_password}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
      HOUSEHOLD_DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD:-household_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  identity:
    build:
      context: ../identity
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./uploads/avatars:/data/avatars
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: ${IDENTITY_CONN:-Host=postgres;Database=identity_db;Username=identity_user;Password=identity_password}
      # Throwaway dev key, committed on purpose so `compose up` needs no setup.
      # Production has no default: compose refuses to start without JWT_PRIVATE_KEY_PEM.
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      # Dev only. A parallel e2e run drives more traffic per minute than any real user; production
      # keeps the defaults compiled into Program.cs.
      RateLimiting__standard: "5000"
      RateLimiting__auth: "5000"
      RateLimiting__write: "5000"
      RateLimiting__api: "5000"
      RateLimiting__search: "5000"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__BaseUrl: http://localhost:3000
      Storage__LocalPath: /data/avatars
      Storage__PublicBaseUrl: http://localhost:3000/uploads/avatars

  forum:
    build:
      context: ../forum
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./uploads/forum:/data/forum
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Forum: ${FORUM_CONN:-Host=postgres;Database=forum_db;Username=forum_user;Password=forum_password}
      Jwt__Authority: http://identity:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      # Dev only. A parallel e2e run drives more traffic per minute than any real user; production
      # keeps the defaults compiled into Program.cs.
      RateLimiting__standard: "5000"
      RateLimiting__auth: "5000"
      RateLimiting__write: "5000"
      RateLimiting__api: "5000"
      RateLimiting__search: "5000"
      Media__RootPath: /data/forum
      Media__PublicBaseUrl: http://localhost:3000/uploads/forum

  finance:
    build:
      context: ../finance
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Finance: ${FINANCE_CONN:-Host=postgres;Database=finance_db;Username=finance_user;Password=finance_password}
      Jwt__Authority: http://identity:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      # Dev only. A parallel e2e run drives more traffic per minute than any real user; production
      # keeps the defaults compiled into Program.cs.
      RateLimiting__standard: "5000"
      RateLimiting__auth: "5000"
      RateLimiting__write: "5000"
      RateLimiting__api: "5000"
      RateLimiting__search: "5000"
      Plaid__ClientId: ${PLAID_CLIENT_ID:-}
      Plaid__Secret: ${PLAID_SECRET:-}
      Plaid__Environment: ${PLAID_ENVIRONMENT:-sandbox}
      Plaid__WebhookUrl: ${PLAID_WEBHOOK_URL:-}

  notifications:
    build:
      context: ../notifications
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Notifications: ${NOTIFICATIONS_CONN:-Host=postgres;Database=notifications_db;Username=notifications_user;Password=notifications_password}
      Jwt__Authority: http://identity:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      # Dev only. A parallel e2e run drives more traffic per minute than any real user; production
      # keeps the defaults compiled into Program.cs.
      RateLimiting__standard: "5000"
      RateLimiting__auth: "5000"
      RateLimiting__write: "5000"
      RateLimiting__api: "5000"
      RateLimiting__search: "5000"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__FromAddress: noreply@hankkarpinen.com
      Email__FromName: hankkarpinen.com
      Email__BaseUrl: http://localhost:3000

  household:
    build:
      context: ../household
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Household: ${HOUSEHOLD_CONN:-Host=postgres;Database=household_db;Username=household_user;Password=household_password}
      Jwt__Authority: http://identity:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      # Dev only. A parallel e2e run drives more traffic per minute than any real user; production
      # keeps the defaults compiled into Program.cs.
      RateLimiting__standard: "5000"
      RateLimiting__auth: "5000"
      RateLimiting__write: "5000"
      RateLimiting__api: "5000"
      RateLimiting__search: "5000"

  math:
    build:
      context: ../math
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Authority: http://identity:8080

  geography:
    build:
      context: ../geography
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Authority: http://identity:8080
      OpenWeatherMap__ApiKey: ${OPENWEATHERMAP_API_KEY:-}

  # The route table, same project and same appsettings as production.
  # No depends_on: destinations resolve per request, so `up -d postgres rabbitmq identity finance
  # gateway edge` works and /api/forum/* simply answers 502 until you start forum.
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-ghcr.io/hkarpinen/portfolio-gateway:dev}
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SVC_IDENTITY_URL: http://identity:8080
      SVC_FORUM_URL: http://forum:8080
      SVC_FINANCE_URL: http://finance:8080
      SVC_NOTIFICATIONS_URL: http://notifications:8080
      SVC_HOUSEHOLD_URL: http://household:8080
      SVC_MATH_URL: http://math:8080
      SVC_GEOGRAPHY_URL: http://geography:8080

  # For the e2e suite, not for day-to-day dev. A production build has no rewrites, so something
  # has to put the pages and /api/* on one origin the way nginx does in production — this is the
  # smallest thing that does, and it carries no route table.
  #
  # `next dev` needs none of this: it keeps its own :3000 and rewrites /api/* to the gateway.
  # Profiled so `docker compose up` does not start it; run.sh names it explicitly.
  edge:
    image: nginx:alpine
    profiles: ["e2e"]
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GATEWAY_UPSTREAM: gateway:8080
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-host.docker.internal:3000}
    command: >
      /bin/sh -c
      "envsubst '$$GATEWAY_UPSTREAM $$FRONTEND_UPSTREAM' < /etc/nginx/nginx.dev.conf.template > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    volumes:
      - ./nginx.dev.conf.template:/etc/nginx/nginx.dev.conf.template:ro

volumes:
  pgdata:
  rabbitmq_data:
