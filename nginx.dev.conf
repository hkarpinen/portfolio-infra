worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Dev only: nginx exists solely to serve /uploads/* from Docker named volumes
    # that the local Next.js process cannot access directly.
    # All API traffic (including SSE) is handled by Next.js rewrites → direct to
    # each backend port. See frontend/next.config.mjs.
    server {
        listen 80;
        server_name localhost;

        location /uploads/avatars/ {
            alias /var/www/avatars/;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Disposition "inline";
            try_files $uri =404;
        }

        location /uploads/forum/ {
            alias /var/www/forum/;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Disposition "inline";
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
